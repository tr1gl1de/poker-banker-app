# Памяти на машине разработчика мало: не поднимать без нужды.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Базовая версия продукта — единственное место. Release = ровно она (тег vX.Y.Z обязан совпадать),
# debug = <base>-dev.<число коммитов>+<короткий sha>. versionCode = git rev-list --count HEAD.
feltbook.versionName=0.1.0
