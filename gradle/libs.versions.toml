# Единственное место, где задаются версии. Перед обновлением проверь последнюю стабильную.
[versions]
agp = "9.5.0"
kotlin = "2.4.21"
ksp = "2.3.13"
compileSdk = "37"
targetSdk = "36"
minSdk = "26"

compose-bom = "2026.09.00"
material3-adaptive = "1.3.0"
activity-compose = "1.13.0"
navigation-compose = "2.10.2"
lifecycle = "2.11.0"
hilt = "2.60.1"
hilt-navigation-compose = "1.4.0"
room = "2.8.5"
datastore = "1.3.0"
core-ktx = "1.19.1"
core-splashscreen = "1.2.0"
play-services-nearby = "19.5.1"
profileinstaller = "1.4.1"
benchmark-macro = "1.5.0"
# Плагин Baseline Profile выходит вместе с androidx.benchmark — держим одну версию.
baselineprofile = "1.5.0"
uiautomator = "2.4.0"
androidx-test-ext-junit = "1.3.0"
androidx-test-runner = "1.7.0"
espresso = "3.7.0"

kotlinx-serialization = "1.12.0"
kotlinx-coroutines = "1.11.0"
kotlinx-datetime = "0.8.0"
vico = "3.3.1"

junit-jupiter = "5.14.4"
junit4 = "4.13.2"
turbine = "1.2.1"
robolectric = "4.17"
roborazzi = "1.77.0"

ktlint-gradle = "14.2.0"
ktlint = "1.8.0"
detekt = "1.23.8"
kover = "0.9.11"

[libraries]
# AndroidX
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
