# Обновления зависимостей — PR раз в неделю. Версии Gradle живут в gradle/libs.versions.toml.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
    groups:
      gradle:
        patterns:
          - "*"
