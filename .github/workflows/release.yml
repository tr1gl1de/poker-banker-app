name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # versionCode = число коммитов в HEAD; сборка с тега падает на shallow-клоне.
          fetch-depth: 0

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Android SDK 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      # Раннер CI — 16 ГБ: куча демона больше, чем в gradle.properties (там — под машину разработчика).
      # ~/.gradle/gradle.properties приоритетнее проектного.
      - name: Gradle memory for CI
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties

      - name: Release tag
        id: tag
        run: |
          tag=""
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      # Та же проверка, что в build.yml: релиз не собирается из непроверенного коммита.
      - name: Build, tests, lint, ktlint, detekt, screenshots
        run: >
          ./gradlew build ktlintCheck detekt verifyRoborazziDebug
          "-Pfeltbook.releaseTag=${{ steps.tag.outputs.value }}" --continue --stacktrace

      - name: Keystore
        id: keystore
        env:
          FELTBOOK_KEYSTORE_BASE64: ${{ secrets.FELTBOOK_KEYSTORE_BASE64 }}
          FELTBOOK_KEYSTORE_PASSWORD: ${{ secrets.FELTBOOK_KEYSTORE_PASSWORD }}
          FELTBOOK_KEY_ALIAS: ${{ secrets.FELTBOOK_KEY_ALIAS }}
          FELTBOOK_KEY_PASSWORD: ${{ secrets.FELTBOOK_KEY_PASSWORD }}
        run: |
          set_count=0
          missing=""
          for name in FELTBOOK_KEYSTORE_BASE64 FELTBOOK_KEYSTORE_PASSWORD FELTBOOK_KEY_ALIAS FELTBOOK_KEY_PASSWORD; do
            if [ -n "${!name}" ]; then set_count=$((set_count + 1)); else missing="$missing $name"; fi
          done
          if [ "$set_count" -eq 4 ]; then
            echo "$FELTBOOK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/feltbook.jks"
            echo "FELTBOOK_KEYSTORE_FILE=$RUNNER_TEMP/feltbook.jks" >> "$GITHUB_ENV"
            echo "suffix=" >> "$GITHUB_OUTPUT"
          elif [ "$set_count" -eq 0 ]; then
            echo "::warning::Секреты подписи не заданы — release собирается без подписи"
            echo "suffix=-unsigned" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Секреты подписи заданы частично: нет$missing. Задайте все четыре или ни одного."
            exit 1
          fi

      - name: Build release APK and AAB
        env:
          FELTBOOK_KEYSTORE_PASSWORD: ${{ secrets.FELTBOOK_KEYSTORE_PASSWORD }}
          FELTBOOK_KEY_ALIAS: ${{ secrets.FELTBOOK_KEY_ALIAS }}
          FELTBOOK_KEY_PASSWORD: ${{ secrets.FELTBOOK_KEY_PASSWORD }}
        run: |
          tag="${{ steps.tag.outputs.value }}"
          ./gradlew assembleRelease bundleRelease "-Pfeltbook.releaseTag=$tag" --stacktrace
          ./gradlew -q :app:printVersion "-Pfeltbook.releaseTag=$tag" | tee version.txt
          version=$(grep '^versionName=' version.txt | cut -d= -f2)
          suffix="${{ steps.keystore.outputs.suffix }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release*.apk "dist/feltbook-$version$suffix.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/feltbook-$version$suffix.aab"
          # Карта R8 — для расшифровки стектрейсов релиза.
          cp app/build/outputs/mapping/release/mapping.txt "dist/feltbook-$version-mapping.txt"
          if [ -z "$suffix" ]; then
            # Подписанный APK: проверка подписи и отпечаток сертификата — в summary (сверка с keystore владельца).
            build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            "$build_tools/apksigner" verify --print-certs "dist/feltbook-$version.apk" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          (cd dist && sha256sum -- * > "feltbook-$version-SHA256SUMS.txt")
          echo "### Feltbook $version$suffix" >> "$GITHUB_STEP_SUMMARY"
          ls dist >> "$GITHUB_STEP_SUMMARY"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/feltbook.jks"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feltbook-release
          path: dist/
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/outputs/roborazzi/
          if-no-files-found: ignore

      - name: GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        # dist/* включает APK, AAB, feltbook-<версия>-mapping.txt и SHA256SUMS.
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "Feltbook $GITHUB_REF_NAME" --generate-notes --verify-tag
