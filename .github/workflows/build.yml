name: build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # versionCode = число коммитов в HEAD: нужна полная история.
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Android SDK 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Version
        id: version
        run: |
          ./gradlew -q :app:printVersion | tee version.txt
          echo "code=$(grep '^versionCode=' version.txt | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "dev=$(grep '^devVersionName=' version.txt | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Build, tests, lint, ktlint, detekt, screenshots
        run: ./gradlew build ktlintCheck detekt verifyRoborazziDebug --continue --stacktrace

      - name: Rename debug APK
        id: apk
        run: |
          name="feltbook-${{ steps.version.outputs.dev }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          {
            echo "### Feltbook ${{ steps.version.outputs.dev }}"
            echo ""
            echo "- versionCode: \`${{ steps.version.outputs.code }}\`"
            echo "- debug APK: \`$name\` (applicationId \`app.feltbook.dev\`) — в артефактах этого прогона"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/outputs/roborazzi/
          if-no-files-found: ignore
